<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Menu</title>
</head>

<body>
    <div class="container">
        <div id="page-content">
            <div id="header-placeholder"></div>
            <main id="main-catalog">
                <h1>Behind each of our cups hides an <span class="catalog-span">amazing surprise</span></h1>
                <nav>
                    <ul id="category-menu" class="ul-catalog">
                        <li>
                            <button class="btn-category category" id="coffee"">
                            <span class=" circle super-light">
                                <img src="images/tabs/coffee.png" alt="coffee">
                                </span>
                                Coffee
                            </button>
                        </li>
                        <li>
                            <button class="btn-category category" id="tea"">
                            <span class=" circle super-light">
                                <img src="images/tabs/tea.png" alt="tea">
                                </span>
                                Tea
                            </button>
                        </li>
                        <li>
                            <button class="btn-category category" id="dessert"">
                            <span class=" circle super-light">
                                <img src="images/tabs/dessert.png" alt="dessert">
                                </span>
                                Dessert
                            </button>
                        </li>
                    </ul>
                </nav>
                <section id="card-container" class="card-container"></section>
            </main>
            <div id="footer-placeholder"></div>
        </div>
        <dialog id="modal" class="modal">
    </div>
</body>

</html>
